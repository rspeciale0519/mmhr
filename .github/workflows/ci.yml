name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  integration:
    uses: ./.github/workflows/integration.yml
    permissions:
      contents: read

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check integration matrix
        run: npm run check:integration-matrix

      - name: Validate R9 evidence manifest
        run: npm run check:r9-evidence

      - name: Upload R9 evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: r9-release-evidence
          path: scripts/r9-release-evidence.json
          if-no-files-found: error

      - name: Dependency audit
        run: npm run check:dependency-audit

      - name: Secret scan
        run: npm run check:secrets

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time only. Real values live in Vercel; these just satisfy the
          # env reads so the build can compile.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:56321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_BRAND_NAME: MatchMaker HR
          # Unset DSN keeps Sentry inert and skips source-map upload.
          SENTRY_AUTH_TOKEN: ""
